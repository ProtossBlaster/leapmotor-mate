# Keeps the pinned actions from freezing forever.
#
# Every `uses:` in .github/workflows is pinned to a commit SHA rather than a moving tag, because a
# tag is a pointer somebody else controls: whoever can move `@v4` can run their own code inside a
# job that holds DOCKERHUB_TOKEN. A SHA cannot be re-pointed.
#
# The cost of that is the mirror image — pinned actions never pick up a fix on their own. Dependabot
# closes it: it reads the `# v4` comment beside each SHA, and opens a PR that moves the SHA and the
# comment together, with the action's release notes attached. Monthly on purpose: security fixes in
# these actions are rare, and a weekly PR nobody reads is how a repo learns to ignore them.
#
# Minor and patch only. Left unfiltered, the first run proposed four MAJOR jumps at once — the
# workflows had been sitting on `@v5`/`@v3` tags for a long time while their authors moved on. A
# major bump can change behaviour, and this is the chain that publishes the image people pull, so
# it is not something to accept from a bot on a Tuesday. Majors stay a decision somebody makes on
# purpose, having read the release notes; what is automated here is only the safe half.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
