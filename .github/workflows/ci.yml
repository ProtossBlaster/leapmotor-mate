name: CI

on:
  push:
    branches: [main, prebuild]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
      - name: Install test deps
        # Exercise the same dependency sets as production. httpx is test-only: Starlette's
        # TestClient needs it for the live middleware/API regression tests.
        run: pip install pytest httpx playwright -r poller/requirements.txt -r web/requirements.txt
      - name: Install browser for command UI regressions
        run: python -m playwright install --with-deps chromium
      - name: Run tests
        run: pytest -q

  # ── Does the desktop app still fit this code? ────────────────────────────────────────────
  # MateDesktop ships a SHELL (Python + the compiled libraries) and fetches the payload — web/ +
  # poller/ — from this repository on every launch. That is what lets Mate release almost daily
  # while the shell is rebuilt about twice a year.
  #
  # It has exactly one failure mode. The shell carries the libraries these two requirements files
  # asked for on the day it was built; if a release later asks for something new, the app REFUSES
  # the payload rather than dying on import, and every desktop user quietly stops moving forward
  # until a new shell is published. Nothing in Mate's own tests can see that coming — it is not a
  # bug in this repository, it is a mismatch with a package built somewhere else.
  #
  # Six times in 176 releases, so it is exactly the kind of thing a person forgets. Every published
  # shell records the Mate tag it was seeded from; this reads it back and compares.
  #
  # It fails only on a tag — the moment a release is actually being cut. On ordinary pushes it
  # warns, so that day-to-day work is never blocked by a shell that simply has not been rebuilt
  # yet. And it stays quiet on anything it cannot determine: the only thing that turns it red is
  # the real condition.
  shell-compat:
    name: Desktop shell still fits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0        # the seed is a tag, and a shallow clone cannot see one
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'   # what the shipped shell runs, so the reproduction matches it
      - name: Can the published shell satisfy this payload?
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/shell_compat.py --head .

  migration-windows:
    name: Windows migration and private material
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install pytest httpx -r poller/requirements.txt -r web/requirements.txt
      - run: python -m pytest -q tests/test_mate_api_migration.py tests/test_private_material_portability.py tests/test_application_bundle.py tests/test_cloud_access_env.py tests/test_automatic_material.py tests/test_migration_activation.py tests/test_migration_preflight.py tests/test_startup_api_backend.py
