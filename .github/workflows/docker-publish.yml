# Build & publish a ready-to-run Docker image to the GitHub Container Registry (GHCR) and to
# Docker Hub, so standalone-Docker users can `docker pull` instead of cloning + building from
# source. GHCR needs NO extra secrets (built-in GITHUB_TOKEN); Docker Hub needs the
# DOCKERHUB_USERNAME + DOCKERHUB_TOKEN repo secrets — when they are absent (e.g. forks) the
# Docker Hub steps are skipped and the workflow publishes to GHCR only. The Home-Assistant
# add-on path is unaffected (it pulls the GHCR image); this is purely standalone convenience.
name: Publish Docker image (GHCR + Docker Hub)

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Hoisted to env because the `secrets` context is not available in step-level `if`.
  # Empty when the secret is unset (forks / pre-setup) → the Docker Hub steps no-op.
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up QEMU (for arm64 emulation)
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5
        with:
          # Same tags for both registries; the Docker Hub image is enabled only when the
          # secrets exist, so forks (and this repo, pre-setup) still publish to GHCR alone.
          images: |
            name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            name=docker.io/${{ env.DOCKERHUB_USERNAME }}/leapmotor-mate,enable=${{ env.DOCKERHUB_USERNAME != '' }}
          # `latest` on the default branch; the version on a vX.Y.Z tag; always a short SHA.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # MateBetaTesterOnly: SAME source, built with MATE_RESEARCH=1 → full-signal capture on.
      # Published as a rolling `:beta` tag (+ `:beta-<sha>` for traceability). The official tags
      # above are built flag-off, so normal users are never on the research build.
      - name: Beta image metadata (tags + labels)
        id: meta-beta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5
        with:
          images: |
            name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            name=docker.io/${{ env.DOCKERHUB_USERNAME }}/leapmotor-mate,enable=${{ env.DOCKERHUB_USERNAME != '' }}
          tags: |
            type=raw,value=beta
            type=sha,prefix=beta-,format=short

      - name: Build and push BETA (amd64 + arm64)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            MATE_RESEARCH=1
          tags: ${{ steps.meta-beta.outputs.tags }}
          labels: ${{ steps.meta-beta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Keeps the Docker Hub repo page (short description + overview) in sync with
      # docs/DOCKERHUB.md — the full README is bilingual and over Docker Hub's 25 KB limit.
      - name: Sync Docker Hub description
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: peter-evans/dockerhub-description@432a30c9e07499fd01da9f8a49f0faf9e0ca5b77  # v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_USERNAME }}/leapmotor-mate
          # NB: Docker Hub's limit is 100 BYTES (multi-byte chars like — count as 3) — keep ASCII.
          short-description: "Self-hosted companion for Leapmotor EVs: trips, charges, costs, battery health, MQTT/Home Assistant"
          readme-filepath: ./docs/DOCKERHUB.md
